<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Hola Mundo en HTML, CSS y JavaScript vanilla, desplegado automáticamente en GitHub Pages."
    />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>¡Hola, Mundo!</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23007AFF'/%3E%3Ctext x='50' y='70' font-size='58' font-weight='600' text-anchor='middle' fill='white' font-family='-apple-system,system-ui'%3EH%3C/text%3E%3C/svg%3E"
    />

    <!-- Aplica el tema antes del primer pintado para evitar el flash (FOUC). -->
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="hero">
      <article class="card">
        <header class="card__header">
          <p class="eyebrow" id="greeting">Bienvenido</p>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Cambiar a modo oscuro"
          >
            <svg
              class="theme-toggle__icon theme-toggle__icon--sun"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4.2" />
              <path
                d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"
              />
            </svg>
            <svg
              class="theme-toggle__icon theme-toggle__icon--moon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          </button>
        </header>

        <h1 class="card__title">¡Hola, <span class="accent">Mundo</span>!</h1>

        <p class="card__subtitle">
          Una página estática hecha con <strong>HTML</strong>, <strong>CSS</strong> y
          <strong>JavaScript vanilla</strong>, publicada automáticamente en
          <strong>GitHub&nbsp;Pages</strong> con cada <code>push</code> a
          <code>main</code>.
        </p>

        <ul class="stack" aria-label="Tecnologías utilizadas">
          <li>HTML5</li>
          <li>CSS3</li>
          <li>JavaScript ES6+</li>
          <li>GitHub Actions</li>
        </ul>
      </article>
    </main>

    <footer class="footer">
      <p>
        Hecho con código vanilla · <span id="year">2026</span> ·
        <a
          href="https://github.com/GregoriEJimenezDev/Hellowold"
          rel="noopener noreferrer"
          >Código en GitHub</a
        >
      </p>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
